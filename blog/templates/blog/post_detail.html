{% extends 'blog/base.html' %}

{% block content %}

    <div class="post">

        {% if user.is_authenticated %}
    <a class="btn btn-secondary" href="{% url 'post_edit' slug=post.slug %}">
        Edit
    </a>
{% endif %}

        {% if post.published_date %}
            <time class="date">
                {{ post.published_date }}
            </time>
        {% endif %}

        
        <h2>{{ post.title }}</h2>

        <p>{{ post.text|linebreaksbr }}</p>
    </div>

{% endblock %}
