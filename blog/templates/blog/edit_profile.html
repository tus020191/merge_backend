{% extends 'blog/base.html' %}

{% block content %}

<div class="row justify-content-center mt-5 mb-5">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-warning text-dark text-center">
                <h3 class="mb-0">Edit Profile</h3>
            </div>

            <div class="card-body">

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Username</label>
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                value="{{ user.username }}"
                                readonly>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ user.email }}">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input
                                type="text"
                                name="first_name"
                                class="form-control"
                                value="{{ user.first_name }}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input
                                type="text"
                                name="last_name"
                                class="form-control"
                                value="{{ user.last_name }}">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input
                                type="text"
                                name="city"
                                class="form-control"
                                value="{{ user.city }}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">State</label>
                            <input
                                type="text"
                                name="state"
                                class="form-control"
                                value="{{ user.state }}">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input
                            type="text"
                            name="phone_no"
                            class="form-control"
                            value="{{ user.phone_no }}">
                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Change Profile Image
                        </label>

                        <input
                            type="file"
                            name="profile_image"
                            class="form-control">

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-warning">

                            Update Profile

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
