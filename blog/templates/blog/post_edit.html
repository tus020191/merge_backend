{% extends 'blog/base.html' %}

{% block content %}
<h2>
    {% if form.instance.pk %}
        Edit Post
    {% else %}
        New Post
    {% endif %}
</h2>
   <form method="POST"
        enctype="multipart/form-data"
        class="post-form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="save btn btn-secondary">
            Save
        </button>
    </form>
{% endblock %}
